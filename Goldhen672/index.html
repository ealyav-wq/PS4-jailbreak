        border-radius: 50px;

    }

        flex: 1;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 16px;
        text-align: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .stat-box.pass {
        border-color: rgba(63, 185, 80, 0.3);
    }

    .stat-box.fail {
        border-color: rgba(248, 81, 73, 0.3);
    }

    .stat-label {
        font-size: 14px;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 6px;
        font-weight: 700;
    }

    .stat-value {
        font-size: 28px;
        font-weight: 800;
    }

    .stat-box.pass .stat-value {
        color: var(--pass-green);
    }

    .stat-box.fail .stat-value {
        color: var(--fail-red);
    }

    .content-footer {
        width: 100%;
        max-width: 900px;
        background: var(--card-bg);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        font-size: 14px;
        color: var(--text-secondary);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .credits-author {
        color: #ffffff;
        font-weight: bold;
        font-size: 16px;
        margin-top: 4px;
        margin-bottom: 16px;
    }

    .thanks-box {
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding-top: 14px;
    }

    .thanks-title {
        color: #e3b341;
        font-weight: 700;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 6px;
    }

    .thanks-list {
        font-size: 13px;
        color: var(--text-secondary);
    }
</style>
