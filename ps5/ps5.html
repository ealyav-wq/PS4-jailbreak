<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elya Host - PS5 Web Portal</title>
<style>
    :root {
        --bg-color: #0b0e14;
        --card-bg: #161b22;
        --accent-blue: #00e5ff;
        --accent-glow: rgba(0, 229, 255, 0.25);
        --text-primary: #f0f6fc;
        --text-secondary: #8b949e;
        --button-bg: #21262d;
        --button-hover: #30363d;
        --input-bg: #0d1117;
        --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 30px 20px;
    }

    .page {
        width: 100%;
        max-width: 900px;
    }

    .header-container {
        text-align: center;
        margin-bottom: 24px;
    }

    h1.main-title {
        color: var(--accent-blue);
        font-size: 32px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 0 15px var(--accent-glow);
        margin-bottom: 8px;
    }

    .status-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 50px;
        padding: 8px 24px;
        display: inline-block;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    #msgs {
        font-size: 16px;
        font-weight: 600;
        color: #ffffff;
    }

    .url-bar {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        margin-bottom: 20px;
    }

    #url_form {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
    }

    #link {
        flex: 1;
        height: 48px;
        padding: 0 18px;
        border-radius: 8px;
        border: 1px solid #30363d;
        outline: none;
        background: var(--input-bg);
        color: var(--text-primary);
        font-size: 16px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #link:focus {
        border-color: var(--accent-blue);
        box-shadow: 0 0 12px var(--accent-glow);
    }

    .btn {
        background: var(--button-bg);
        color: var(--text-primary);
        border: 1px solid #30363d;
        border-radius: 8px;
        height: 48px;
        padding: 0 24px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
    }

    .btn:hover {
        background: var(--button-hover);
        border-color: var(--accent-blue);
        color: var(--accent-blue);
        box-shadow: 0 0 12px var(--accent-glow);
        transform: translateY(-2px);
    }

    .btn-primary {
        background: #1f6feb;
        border-color: #388bfd;
        color: #ffffff;
    }

    .btn-primary:hover {
        background: #388bfd;
        color: #ffffff;
    }

    .actions {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
    }

    .actions .btn {
        flex: 1;
    }

    #saved_info {
        font-size: 13px;
        color: var(--text-secondary);
        word-break: break-all;
        background: var(--input-bg);
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .section-title {
        color: #e3b341;
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-align: center;
    }

    .nav-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
    }

    .nav-grid button {
        background: var(--button-bg);
        border: 1px solid #30363d;
        color: var(--text-primary);
        border-radius: 8px;
        padding: 12px 16px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.2s ease-in-out;
    }

    .nav-grid button:hover {
        background: var(--button-hover);
        border-color: var(--accent-blue);
        color: var(--accent-blue);
        box-shadow: 0 0 12px var(--accent-glow);
        transform: translateY(-2px);
    }

    .card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 24px;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .card p {
        color: var(--text-secondary);
        line-height: 1.6;
        font-size: 15px;
    }

    @media (max-width: 650px) {
        #url_form {
            flex-direction: column;
        }

        .actions {
            flex-direction: column;
        }
    }
</style>
</head>

<body>

<div class="page">

    <div class="header-container">
        <h1 class="main-title">Elya Host - PS5 Portal</h1>
        <div class="status-card">
            <span id="msgs">PS5 Web Portal</span>
        </div>
    </div>

    <div class="url-bar">
        <form id="url_form" onsubmit="return false;">
            <input
                id="link"
                type="text"
                placeholder="Enter URL (e.g. www.google.com)"
                autocomplete="on"
                value="www.google.com"
                required>

            <button
                class="btn btn-primary"
                type="button"
                onclick="load_full(); return false;">
                GO
            </button>
        </form>

        <div class="actions">
            <button
                class="btn"
                type="button"
                onmouseover="msgs.innerHTML='Load saved HTTP host without protocol/index'"
                onmouseout="msgs.innerHTML='PS5 Web Portal'"
                onclick="load_link(); return false;">
                Load Saved
            </button>

            <button
                class="btn"
                type="button"
                onmouseover="msgs.innerHTML='Save current URL address to storage'"
                onmouseout="msgs.innerHTML='PS5 Web Portal'"
                onclick="load_save(); return false;">
                Save URL
            </button>
        </div>

        <div id="saved_info">No saved address yet.</div>
    </div>

    <div class="url-bar">
        <div class="section-title">Quick Launches & Exploits</div>
        <div class="nav-grid">
            <button type="button" onclick="document.getElementById('link').value='https://kar0218.github.io/ps5/UMTX';">
                1.00 - 5.XX
            </button>
            <button type="button" onclick="document.getElementById('link').value='https://kar0218.github.io/ps5/poopspl';">
                7.00 - 12.00
            </button>
            <button type="button" onclick="document.getElementById('link').value='https://kar0218.github.io/ps5/P2JB';">
                12.00 - 12.70
            </button>
            <button type="button" onclick="document.getElementById('link').value='https://es7in1.site//';">
                ECHO STRETCH
            </button>
            <button type="button" onclick="document.getElementById('link').value='https://www.youtube.com/';">
                YouTube
            </button>
            <button type="button" onclick="document.getElementById('link').value='https://www.google.com/';">
                Google
            </button>
        </div>
    </div>

    <main class="card">
        <p>Custom PS5 Web Portal with direct navigation, local URL saving, and firmware exploit quick links.</p>
    </main>

</div>

<script>
function load_save(){
    var karo = document.getElementById('link').value.trim();

    if(!karo){
        document.getElementById('msgs').innerHTML = "Enter a URL first.";
        return;
    }

    localStorage.setItem("url", karo);
    document.getElementById('saved_info').innerHTML = "Saved: " + karo;
}

function load_link(){
    var url = localStorage.getItem("url");

    if(!url){
        document.getElementById('msgs').innerHTML = "No saved URL.";
        return;
    }

    window.location.href = "http://" + url + "/";
}

function load_full(){
    var url = document.getElementById('link').value.trim();

    if(!url){
        document.getElementById('msgs').innerHTML = "Enter a URL first.";
        return;
    }

    if(!/^https?:\/\//i.test(url)){
        url = "https://" + url;
    }

    window.location.href = url;
}

(function(){
    var saved = localStorage.getItem("url");

    if(saved){
        document.getElementById('saved_info').innerHTML = "Saved: " + saved;
    }
})();
</script>

</body>
</html>
